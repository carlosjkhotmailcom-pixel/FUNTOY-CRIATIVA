<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polaroid Print</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1ec;color:#222}
header{padding:18px;text-align:center;background:#111;color:white}header h1{margin:0;font-size:24px}
main{max-width:1050px;margin:auto;padding:16px;display:grid;grid-template-columns:330px 1fr;gap:18px}
.panel,.paper{background:white;border-radius:18px;padding:16px;box-shadow:0 5px 22px #0001}
label{display:block;font-weight:700;margin:12px 0 6px}
button,input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ccc;font-size:16px}
button{background:#111;color:white;border:0;font-weight:700;cursor:pointer;margin-top:8px}
button.secondary{background:#eee;color:#222}.row{display:flex;gap:8px}.row>*{flex:1}
#camera{width:100%;aspect-ratio:4/3;background:#222;border-radius:12px;object-fit:cover}
#paper{min-height:500px;display:grid;place-items:center;background:#eee}
.sheet{background:#fff;padding:20px;display:grid;gap:18px;max-width:100%;width:min(700px,100%);box-shadow:0 3px 15px #0002}
.photo{background:#fff;padding:10px 10px 42px;box-shadow:0 2px 8px #0003;position:relative;overflow:hidden}
.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.caption{position:absolute;bottom:9px;left:10px;right:10px;text-align:center;font-size:15px}
.time{font-size:11px;opacity:.7}
@media(max-width:800px){main{grid-template-columns:1fr}.panel{order:2}.paper{order:1}}
@media print{
 header,.panel{display:none!important}body{background:white}.paper{box-shadow:none;padding:0}.sheet{box-shadow:none;width:100%;max-width:none}
}
</style>
</head>
<body>
<header><h1>📸 Polaroid Print</h1><div>Foto instantânea • data/hora • texto • impressão</div></header>
<main>
<section class="panel">
<video id="camera" autoplay playsinline></video>
<div class="row">
<button id="start">📷 Abrir câmera</button>
<button id="shot" class="secondary">Capturar</button>
</div>
<input id="file" type="file" accept="image/*" capture="environment" style="margin-top:8px">
<label>Fotos na folha</label>
<select id="layout"><option value="1">1 foto</option><option value="2">2 fotos</option><option value="3">3 fotos</option><option value="4">4 fotos</option></select>
<label>Texto da foto</label>
<input id="text" placeholder="Ex.: Funtoy • Sobral">
<label>Mostrar data e hora</label>
<select id="showtime"><option value="yes">Sim</option><option value="no">Não</option></select>
<label>Formato da folha</label>
<select id="size"><option value="a4">A4</option><option value="10x15">10 × 15 cm</option></select>
<button id="print">🖨️ Imprimir</button>
<button id="clear" class="secondary">Limpar fotos</button>
</section>
<section class="paper"><div id="paper"></div></section>
</main>
<script>
const video=document.querySelector('#camera'), paper=document.querySelector('#paper');
const photos=[], file=document.querySelector('#file');
let stream=null;
async function startCamera(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream}
 catch(e){alert('Não foi possível abrir a câmera. Você pode escolher uma foto pelo botão de arquivo.')}
}
document.querySelector('#start').onclick=startCamera;
document.querySelector('#shot').onclick=()=>{
 if(!video.srcObject){alert('Abra a câmera primeiro.');return}
 const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;
 c.getContext('2d').drawImage(video,0,0);addPhoto(c.toDataURL('image/jpeg',.92));
};
file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>addPhoto(r.result);r.readAsDataURL(f)};
function addPhoto(src){photos.push(src); if(photos.length>4)photos.shift();render()}
function render(){
 paper.innerHTML='';
 const n=+document.querySelector('#layout').value;
 const sheet=document.createElement('div');sheet.className='sheet';
 sheet.style.gridTemplateColumns=n===1?'1fr':n===2?'repeat(2,1fr)':n===3?'repeat(3,1fr)':'repeat(2,1fr)';
 const text=document.querySelector('#text').value;
 const show=document.querySelector('#showtime').value==='yes';
 for(let i=0;i<n;i++){
   const p=document.createElement('div');p.className='photo';
   const img=document.createElement('img');img.src=photos[i%photos.length]||placeholder();
   p.appendChild(img);
   const cap=document.createElement('div');cap.className='caption';
   cap.innerHTML=(text?escapeHtml(text)+'<br>':'')+(show?'<span class="time">'+new Date().toLocaleString('pt-BR')+'</span>':'');
   p.appendChild(cap);sheet.appendChild(p);
 }
 paper.appendChild(sheet);
}
function placeholder(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#ddd"/><text x="50%" y="50%" text-anchor="middle" font-size="28" fill="#777">Sua foto aqui</text></svg>')}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.querySelector('#layout').onchange=render;
document.querySelector('#text').oninput=render;
document.querySelector('#showtime').onchange=render;
document.querySelector('#print').onclick=()=>window.print();
document.querySelector('#clear').onclick=()=>{photos.length=0;render()};
render();
</script>
</body></html>
